[package]
name = "baudtide-sidecar"
version = "0.3.0"
description = "BaudTide native serial backend sidecar"
authors = ["Basil"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "baudtide-backend"
path = "src/main.rs"

[features]
default = []
tauri-app = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
